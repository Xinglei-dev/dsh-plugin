# dsh-fixed-pairing-token bundle patch: one loader entry, nothing else.
#
# The token belongs to the profile patch layer, not to this package, so the
# package never carries a credential. Set it there:
#
#   - id: fixed-pairing-token
#     config:
#       token: '<your token>'
#
# or export DSH_PAIRING_TOKEN in the environment that starts `dsh web`.
- insert:
    - id: fixed-pairing-token
      name: 'dsh-fixed-pairing-token'
